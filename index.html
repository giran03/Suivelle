<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Suivelle: a universe for your thoughts." />
    <meta name="theme-color" content="#0c1329" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <title>Suivelle</title>
    <link rel="preload" href="/fonts/suivelle-nerd-symbols.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/startup-theme.js"></script>
    <style>
      /* Saved colors are restored before first paint; the live appearance settings take over on mount. */
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { margin: 0; background: var(--background, light-dark(#f7f6f2, #0c1329)); }
      .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--text-primary, light-dark(#151b2e, #e8edf8)); }
      #startup { position: fixed; inset: 0; z-index: 99999; background: var(--background, light-dark(#f7f6f2, #0c1329)); }
      .splash button { font: inherit; padding: 8px 16px; border: 1px solid currentColor; border-radius: 6px; color: inherit; background: transparent; cursor: pointer; }
      #startup-status { max-width: 360px; text-align: center; padding: 0 24px; font-size: 14px; }
      .splash svg { width: 64px; height: 64px; }
      .splash b { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
      .splash .tile { fill: var(--surface-1, light-dark(#f6f5f1, #0b1226)); stroke: var(--border, light-dark(#c9d1e0, transparent)); stroke-width: 2; }
      .splash .s { fill: none; stroke: var(--accent-ui, light-dark(#16275a, #7fa4f0)); }
      .splash .k { fill: var(--accent, light-dark(#3b5ba9, #cfe0ff)); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup">
      <div class="splash" role="status" aria-label="Opening Suivelle">
        <svg viewBox="0 0 96 96" aria-hidden="true"><rect class="tile" x="1" y="1" width="94" height="94" rx="22"/><g transform="translate(48 48) scale(1.08) translate(-55 -47)"><path class="s" d="M66 28H48A12 12 0 0 0 48 52A12 12 0 0 1 48 76H30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path class="k" d="M70 13C71.6 23.5 74.5 26.4 85 28C74.5 29.6 71.6 32.5 70 43C68.4 32.5 65.5 29.6 55 28C65.5 26.4 68.4 23.5 70 13Z"/></g></svg>
        <b>Suivelle</b>
        <span id="startup-status">Opening your workspace…</span>
        <button id="startup-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <script src="/startup-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
