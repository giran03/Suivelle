[package]
name = "suivelle"
version = "0.1.6"
edition = "2021"

[lib]
name = "suivelle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Suivelle"
path = "src/main.rs"

[workspace]
members = ["mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono-tz = "0.10"
arboard = { version = "3", default-features = false, features = ["image-data"] }
dirs = "6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2"
# flate2 only: the zopfli encoder behind "deflate" is used only for levels above 9, which we never ask for.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
csv = "1"
# TLS through ring, the provider the updater plugin already uses, so aws-lc-rs is not compiled in.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2.0.21"
tracing = "0.1.44"
# No env-filter (it compiles a regex engine) or ansi colours; the log is a plain file.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "smallvec", "tracing-log"] }
uuid = { version = "1.27.0", features = ["v4", "v7"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
semver = "1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"

# Compact release binaries; debug/development builds keep their existing settings.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55"
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
ts-rs = "12"
